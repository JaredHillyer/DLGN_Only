[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlgn"
version = "0.1.0"
description = "Differentiable Logic Gate Networks — standalone JAX implementation"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "jaxlib",
    "optax",
    "flax",
    "numpy",
]

[project.optional-dependencies]
data = [
    "torch",
    "torchvision",
    "scikit-learn",
    "Pillow",
]
plot = [
    "matplotlib",
]
dev = [
    "pytest",
]

[project.scripts]
train-dlgn = "dlgn.cli.train:main"
resume-dlgn = "dlgn.cli.resume:main"
inspect-checkpoint = "dlgn.cli.inspect_checkpoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dlgn*"]
